name: Tank War Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare web game assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cp app/src/main/assets/diagnostic.html app/src/main/assets/diagnostic.html

      - name: Validate embedded JavaScript syntax
        run: |
          node --version
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script>([\s\S]*?)<\/script>/);if(!m)throw new Error('script tag not found');new Function(m[1]);console.log('JavaScript syntax OK')"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tank-war-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function hit(r,q){let X=clamp(r.x,q.x,q.x+q.w),Y=clamp(r.y,q.y,q.y+q.h);return(r.x-X)**2+(r.y-Y)**2<r.r*r.r}function blocked(px,py,r=15){return walls.some(w=>w.hp>0&&hit({x:px,y:py,r},w))||D.some(d=>d.hp>0&&hit({x:px,y:py,r},d))}function baseHit(px,py,r=5){return px>BASE.x-BASE.w/2-r&&px<BASE.x+BASE.w/2+r&&py>BASE.y-BASE.h/2-r&&py<BASE.y+BASE.h/2+r}

function update(dt){if(over)return;cd-=dt;P.inv-=dt;BASE.hit-=dt;speedPower-=dt;triplePower-=dt;if(speedPower<=0)P.s=150;if(wavePause>0){wavePause-=dt;if(wavePause<=0)spawnWave();ui();return}let dx=0,dy=0;if(K.has('ArrowUp')||K.has('w'))dy--;if(K.has('ArrowDown')||K.has('s'))dy++;if(K.has('ArrowLeft')||K.has('a'))dx--;if(K.has('ArrowRight')||K.has('d'))dx++;if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;let nx=P.x+dx*P.s*dt,ny=P.y+dy*P.s*dt;if(!blocked(nx,P.y))P.x=clamp(nx,18,542);if(!blocked(P.x,ny))P.y=clamp(ny,18,590);P.a=Math.atan2(dy,dx)}if(K.has(' ')||K.has('Enter'))fire();
for(let e of E){e.tm+=dt;e.hit-=dt;let tar=enemyTarget(e),a=Math.atan2(tar.y-e.y,tar.x-e.x),d=Math.hypot(tar.x-e.x,tar.y-e.y);e.a=a;if(e.t===3){if(d>115){let nx=e.x+Math.cos(a)*22*dt,ny=e.y+Math.sin(a)*22*dt;if(!blocked(nx,ny,20)){e.x=nx;e.y=ny}}}else if(d>60){let sp=e.t===0?50:e.t===1?38:30;let nx=e.x+Math.cos(a)*sp*dt,ny=e.y+Math.sin(a)*sp*dt;if(!blocked(nx,ny)&&Math.hypot(nx-BASE.x,ny-BASE.y)>45){e.x=nx;e.y=ny}}if(tar.type==='base'&&d<52&&Math.hypot(e.x-BASE.x,e.y-BASE.y)<75){if(e.tm>.75){e.tm=0;baseDamage(e.t===3?2:1)}}else if(tar.type==='player'&&d<360&&e.tm>(e.t===3?1.15:e.t===2?2.2:1.5)){e.tm=0;enemyFire(e,P.x,P.y)}else if(tar.type==='base'&&e.tm>(e.t===3?1.15:e.t===2?2.4:1.7)&&d<560){e.tm=0;enemyFire(e,BASE.x,BASE.y)}if(Math.hypot(P.x-e.x,P.y-e.y)<30)hurt()}
for(let i=B.length-1;i>=0;i--){let b=B[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H){if(b.rocket)boom(b.x,b.y);B.splice(i,1);continue}if(b.enemy){let hitW=walls.find(w=>w.hp>0&&hit({x:b.x,y:b.y,r:b.r},w));if(hitW){if(hitW.m==='brick'){hitW.hp-=b.d||1;boom(b.x,b.y,false);if(hitW.hp<=0)boom(hitW.x+hitW.w/2,hitW.y+hitW.h/2,true)}else boom(b.x,b.y,false);B.splice(i,1);continue}let hitD=D.find(d=>d.hp>0&&hit({x:b.x,y:b.y,r:b.r},d));if(hitD){defenseDamage(hitD,b.d||1);B.splice(i,1);continue}if(baseHit(b.x,b.y,b.r)){baseDamage(b.d||1);B.splice(i,1);continue}if(Math.hypot(b.x-P.x,b.y-P.y)<20){B.splice(i,1);hurt()}}else{let hitW=walls.find(w=>w.hp>0&&hit({x:b.x,y:b.y,r:b.r},w));if(hitW){if(hitW.m==='brick'){hitW.hp-=b.d||1;boom(b.x,b.y,false);if(hitW.hp<=0)boom(hitW.x+hitW.w/2,hitW.y+hitW.h/2,true)}else boom(b.x,b.y,false);B.splice(i,1);continue}let hitD=D.find(d=>d.hp>0&&hit({x:b.x,y:b.y,r:b.r},d));if(hitD){defenseDamage(hitD,b.d||1);B.splice(i,1);continue}for(let j=E.length-1;j>=0;j--){let e=E[j];if(Math.hypot(b.x-e.x,b.y-e.y)<22){e.h-=b.d;e.hit=.1;B.splice(i,1);boom(b.x,b.y,b.k===3);if(e.h<=0){score+=e.t===3?1500:e.t===2?250:e.t===1?150:100;if(e.t===3){boom(e.x,e.y,true);for(let k=0;k<3;k++)U.push({x:e.x+(k-1)*30,y:e.y,t:k+1,l:10})}else if(Math.random()<.28)U.push({x:e.x,y:e.y,t:1+Math.floor(Math.random()*3),l:8});E.splice(j,1)}break}}}}

function wall(q){

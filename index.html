function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function hit(r,q){let X=clamp(r.x,q.x,q.x+q.w),Y=clamp(r.y,q.y,q.y+q.h);return(r.x-X)**2+(r.y-Y)**2<r.r*r.r}function blocked(px,py,r=15){return walls.some(w=>w.hp>0&&hit({x:px,y:py,r},w))||D.some(d=>d.hp>0&&hit({x:px,y:py,r},d))}function baseHit(px,py,r=5){return px>BASE.x-BASE.w/2-r&&px<BASE.x+BASE.w/2+r&&py>BASE.y-BASE.h/2-r&&py<BASE.y+BASE.h/2+r}
function snd(t){try{audio=audio||new(AudioContext||webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain(),d=t==='boom'?.3:t==='rocket'?.16:.07;o.type=t==='boom'?'sawtooth':'square';o.frequency.setValueAtTime(t==='boom'?90:t==='rocket'?150:430,audio.currentTime);o.frequency.exponentialRampToValueAtTime(35,audio.currentTime+d);g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function boom(px,py,big){snd('boom');for(let i=0,n=big?34:20;i<n;i++){let a=Math.random()*6.28,s=(big?75:50)*(Math.random()+.3);F.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.35+Math.random()*.5,z:2+Math.random()*5})}}
function setupDefenses(){D.length=0;let y=612;D.push({x:170,y,w:82,h:16,hp:6,max:6});D.push({x:390,y,w:82,h:16,hp:6,max:6});D.push({x:225,y:605,w:48,h:16,hp:4,max:4});D.push({x:335,y:605,w:48,h:16,hp:4,max:4});}
function spawnWave(){let cfg=STAGES[stage-1],baseN=2+cfg.count+Math.floor(stage*.7)+wave, count=Math.min(12,baseN), edges=[{x:20,y:100},{x:540,y:170},{x:25,y:360},{x:535,y:450},{x:280,y:45},{x:95,y:45},{x:465,y:45}],types=cfg.types,offset=(stage*3+wave)%edges.length;for(let i=0;i<count;i++){let q=edges[(offset+i)%edges.length],t=types[(i+wave)%types.length];let hp=t===2?5:t===1?3:2;E.push({x:q.x+(Math.random()*10-5),y:q.y+(Math.random()*10-5),a:(q.x<40?0:q.x>520?Math.PI:q.y<60?Math.PI/2:-Math.PI/2),h:hp,max:hp,t,tm:Math.random()*1.5,hit:0,target:'base',sid:Math.random(),dir:0,turn:Math.random()*.8})}if(stage%5===0&&wave===waveTotal)E.push({x:280,y:45,a:1.57,h:24,max:24,t:3,tm:1,target:'base',sid:Math.random()})}
function load(){let cfg=STAGES[stage-1];walls=maps[stage-1].map(q=>({x:q[0],y:q[1],w:q[2],h:q[3],m:q[4]||'brick',hp:q[4]==='steel'?99:3,max:q[4]==='steel'?99:3}));crates=crates0[stage-1].map(q=>({x:q[0],y:q[1],w:q[2],h:q[3]}));E.length=0;B.length=0;F.length=0;U.length=0;wave=1;waveTotal=cfg.waves;wavePause=0;P.x=280;P.y=570;P.inv=1.5;BASE.max=cfg.baseHp;BASE.hp=cfg.baseHp;BASE.hit=0;speedPower=0;triplePower=0;P.s=150;setupDefenses();spawnWave();ui()}

const stageEl=document.getElementById('stage'),baseHpEl=document.getElementById('basehp'),livesEl=document.getElementById('lives'),scoreEl=document.getElementById('score'),enemyEl=document.getElementById('enemies'),waveEl=document.getElementById('wave'),bossEl=document.getElementById('boss'),powerEl=document.getElementById('power');
function setW(n){weapon=n;[1,2,3].forEach(i=>document.getElementById('w'+i).classList.toggle('active',i===n))}
function baseDamage(n=1){if(over||BASE.hit>0)return;BASE.hp-=n;BASE.hit=.35;boom(BASE.x,BASE.y,true);if(BASE.hp<=0){BASE.hp=0;over=1;ot.textContent='BASE DESTROYED';ox.textContent='SCORE: '+score+' | STAGE: '+stage;overlay.classList.add('show')}}
function defenseDamage(d,n=1){d.hp-=n;boom(d.x,d.y,false);if(d.hp<=0)boom(d.x,d.y,true)}
function fire(){if(over||cd>0)return;let a=P.a,q={x:P.x+Math.cos(a)*27,y:P.y+Math.sin(a)*27,vx:Math.cos(a),vy:Math.sin(a),life:2,r:3,d:1,k:1};if(weapon===1){q.vx*=420;q.vy*=420;cd=.17;snd('shot')}if(weapon===2){q.vx*=330;q.vy*=330;q.r=5;q.d=3;q.k=2;cd=.48;snd('cannon')}if(weapon===3){q.vx*=250;q.vy*=250;q.r=7;q.d=5;q.k=3;q.life=3;q.rocket=1;cd=.78;snd('rocket')}B.push(q);if(triplePower>0)for(let off of [-.18,.18])B.push({...q,vx:Math.cos(a+off)*Math.hypot(q.vx,q.vy),vy:Math.sin(a+off)*Math.hypot(q.vx,q.vy)});for(let i=0;i<5;i++)F.push({x:q.x,y:q.y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,l:.16,z:2,m:1})}
function enemyFire(e,targetX,targetY){let a=Math.atan2(targetY-e.y,targetX-e.x),s=e.t===3?135:e.t===2?145:190;if(e.t===3){for(let off of [-.28,0,.28])B.push({x:e.x+Math.cos(a)*28,y:e.y+Math.sin(a)*28,vx:Math.cos(a+off)*s,vy:Math.sin(a+off)*s,life:3,r:5,d:1,enemy:1,k:0});snd('boom')}else B.push({x:e.x+Math.cos(a)*25,y:e.y+Math.sin(a)*25,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:3,r:4,d:1,enemy:1,k:0});snd('enemy')}
function hurt(){if(P.inv>0)return;lives--;boom(P.x,P.y,1);if(lives<=0){over=1;ot.textContent='GAME OVER';ox.textContent='SCORE: '+score+' | STAGE: '+stage;overlay.classList.add('show')}else{P.x=280;P.y=570;P.inv=2}}
function bomb(){if(over)return;for(let e of E){boom(e.x,e.y,true);score+=e.t===3?1500:e.t===2?250:e.t===1?150:100}E.length=0;snd('boom')}
function enemyTarget(e){let dp=Math.hypot(P.x-e.x,P.y-e.y);if(e.t===1&&dp<360)return {x:P.x,y:P.y,type:'player'};if(e.t===2&&dp<250)return {x:P.x,y:P.y,type:'player'};return {x:BASE.x,y:BASE.y,type:'base'}}
function update(dt){if(over)return;cd-=dt;P.inv-=dt;BASE.hit-=dt;speedPower-=dt;triplePower-=dt;if(speedPower<=0)P.s=150;if(wavePause>0){wavePause-=dt;if(wavePause<=0)spawnWave();ui();return}let dx=0,dy=0;if(K.has('ArrowUp')||K.has('w'))dy=-1;if(K.has('ArrowDown')||K.has('s'))dy=1;if(K.has('ArrowLeft')||K.has('a'))dx=-1;if(K.has('ArrowRight')||K.has('d'))dx=1;
// Classic tank controls: one cardinal direction at a time; no diagonal sliding.
if(dx&&dy){if(lastDir==='ArrowUp'||lastDir==='w'||lastDir==='ArrowDown'||lastDir==='s')dx=0;else dy=0}if(dx||dy){let nx=P.x+dx*P.s*dt,ny=P.y+dy*P.s*dt;if(!blocked(nx,P.y))P.x=clamp(nx,18,542);if(!blocked(P.x,ny))P.y=clamp(ny,18,590);P.a=Math.atan2(dy,dx)}if(firing||K.has(' ')||K.has('Enter'))fire();
for(let e of E){e.tm+=dt;e.hit-=dt;e.turn-=dt;let tar=enemyTarget(e),want=Math.atan2(tar.y-e.y,tar.x-e.x),d=Math.hypot(tar.x-e.x,tar.y-e.y);
 // Classic tank behavior: face one of four directions instead of smoothly rotating.
 let candidates=[0,Math.PI/2,Math.PI,-Math.PI/2];
 let best=candidates[0],bd=9999;
 for(let ang of candidates){let dd=Math.abs(Math.atan2(Math.sin(ang-want),Math.cos(ang-want)));if(dd<bd){bd=dd;best=ang}}
 if(e.turn<=0){e.a=best;e.turn=.22+Math.random()*.45}
 let sp=e.t===3?24:e.t===0?55:e.t===1?43:34;
 let nx=e.x+Math.cos(e.a)*sp*dt,ny=e.y+Math.sin(e.a)*sp*dt;
 let blockedAhead=blocked(nx,ny,e.t===3?20:15);
 if(blockedAhead||nx<24||nx>536||ny<28||ny>585){
   // Turn toward a useful open cardinal lane.
   let opts=candidates.filter(ang=>{let tx=e.x+Math.cos(ang)*22,ty=e.y+Math.sin(ang)*22;return tx>24&&tx<536&&ty>28&&ty<585&&!blocked(tx,ty,e.t===3?20:15)});
   if(opts.length){let pick=opts[Math.floor(Math.random()*opts.length)];e.a=pick}
 }else if(d>52&&!(tar.type==='base'&&d<70)){e.x=nx;e.y=ny}
 if(tar.type==='base'&&d<58&&Math.hypot(e.x-BASE.x,e.y-BASE.y)<78){if(e.tm>.72){e.tm=0;baseDamage(e.t===3?2:1)}}
 else if(tar.type==='player'&&d<360&&e.tm>(e.t===3?1.05:e.t===2?1.75:1.25)){e.tm=0;enemyFire(e,P.x,P.y)}
